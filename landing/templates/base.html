<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/landing.css'%}">
    {% block css_extra %} {% endblock %}
    <title> {% block title %} {% endblock %}</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-xl navbar-light bg-info">
  <div class="container-fluid" bis_skin_checked="1">
    <a class="navbar-brand" href="{% url ''%}">Inicio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBasic" aria-controls="navbarBasic" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse show" id="navbarBasic" bis_skin_checked="1">
      <ul class="navbar-nav me-auto mb-2 mb-xl-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{%url 'aboutUs'%}">Sobre nosotros</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact'%}">Contactanos</a>
        </li>
      </ul>
{%if not request.session.user_email %}
      <div class="ms-auto" id="divLogin">
        <a class="btn btn-outline" id="botonLogin" href="{% url 'login'%}">
          Login
        </a>
      </div>
{%else%}
            <div class="ms-auto" id="divLogin">
        <a class="btn btn-outline" id="botonLogin" href="{%url 'logout'%}">
          Logout
        </a>
      </div>
{%endif%}      
    </div>
  </div>
</nav>
<script src="{%static 'bootstrap/js/bootstrap.js'%}">
</script>

{% block content %} 

{% endblock %}

    <footer class="bg-info text-center text-dark mt-auto">
        <div class="p-3">
            © 2026 Copyright:
            <a class="text-dark text-decoration-none" href="">Lavanderia Flores</a>
        </div>
    </footer>
</body>
</html>
